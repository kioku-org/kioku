name: CI

on:
  push:
    branches: [main, master]
    paths:
      - 'services/**'
      - 'deployment/docker/Dockerfile.*'
      - 'deployment/docker/entrypoint-*.sh'
      - '.github/workflows/ci.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip RunPod integration tests'
        required: false
        type: boolean
        default: false

jobs:
  build-stateful:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          if [[ "${GITHUB_REF##*/}" =~ ^(master|main)$ ]]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT
          fi

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/Dockerfile.stateful
          push: true
          tags: |
            ghcr.io/kioku-org/kioku-stateful:${{ steps.meta.outputs.tag }}
            ghcr.io/kioku-org/kioku-stateful:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=stateful
          cache-to: type=gha,scope=stateful,mode=max,ignore-error=true

  build-stateless:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          if [[ "${GITHUB_REF##*/}" =~ ^(master|main)$ ]]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT
          fi

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/Dockerfile.stateless
          push: true
          tags: |
            ghcr.io/kioku-org/kioku-stateless:${{ steps.meta.outputs.tag }}
            ghcr.io/kioku-org/kioku-stateless:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=stateless
          cache-to: type=gha,scope=stateless,mode=max,ignore-error=true

  test:
    needs: [build-stateful, build-stateless]
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}
    timeout-minutes: 30
    env:
      SHORT_SHA: ${{ needs.build-stateful.outputs.sha }}
      STATEFUL_IMAGE: ghcr.io/kioku-org/kioku-stateful:${{ needs.build-stateful.outputs.sha }}
      STATELESS_IMAGE: ghcr.io/kioku-org/kioku-stateless:${{ needs.build-stateful.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy stateful pod on RunPod
        id: deploy
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          set -euo pipefail

          POD_NAME="ci-kioku-$SHORT_SHA"
          JWT_SECRET=$(openssl rand -hex 32)
          ENC_SECRET=$(openssl rand -hex 32)

          echo "Creating CPU pod: $POD_NAME"
          echo "Image: $STATEFUL_IMAGE"

          PAYLOAD=$(python3 -c "
          import json
          print(json.dumps({
            'name': '$POD_NAME',
            'imageName': '$STATEFUL_IMAGE',
            'computeType': 'CPU',
            'vcpuCount': 4,
            'containerDiskInGb': 20,
            'ports': ['9100/http', '8056/http', '8080/http', '8090/http', '6379/tcp'],
            'env': {
              'DB_NAME': 'kioku',
              'DB_USER': 'kioku',
              'DB_PASSWORD': 'kioku',
              'REDIS_PASSWORD': 'ci-redis',
              'HIVEMIND_JWT_SECRET': '$JWT_SECRET',
              'HIVEMIND_ENCRYPTION_SECRET': '$ENC_SECRET',
              'VEXA_ADMIN_API_TOKEN': 'ci-admin-token',
              'INTERNAL_API_SECRET': 'ci-internal-secret',
              'ORCHESTRATOR_BACKEND': 'runpod',
              'RUNPOD_ACCOUNT_API_KEY': '$RUNPOD_API_KEY',
              'BOT_IMAGE': '$STATELESS_IMAGE',
              'BROWSER_IMAGE': '$STATELESS_IMAGE',
              'CORS_ORIGINS': '*',
              'LOG_LEVEL': 'INFO',
              'VEXA_ENV': 'production',
              'STORAGE_BACKEND': 'minio',
              'MINIO_ACCESS_KEY': 'kioku',
              'MINIO_SECRET_KEY': 'ci-minio-secret',
              'MINIO_BUCKET': 'vexa-recordings',
              'RECORDING_ENABLED': 'false',
            }
          }))
          ")

          RESP=$(curl -s -w "\n%{http_code}" -X POST "https://rest.runpod.io/v1/pods" \
            -H "Authorization: Bearer $RUNPOD_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          HTTP_CODE=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | head -n -1)
          echo "HTTP $HTTP_CODE — $BODY"

          POD_ID=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || echo "")

          if [ -z "$POD_ID" ]; then
            echo "Retrying pod lookup by name..."
            sleep 10
            POD_ID=$(curl -s -H "Authorization: Bearer $RUNPOD_API_KEY" \
              "https://rest.runpod.io/v1/pods?name=$POD_NAME" 2>/dev/null | \
              python3 -c "import sys,json; pods=json.load(sys.stdin); print(pods[0]['id'] if pods else '')" 2>/dev/null || echo "")
          fi

          [ -n "$POD_ID" ] || { echo "ERROR: could not get pod ID"; exit 1; }
          echo "pod_id=$POD_ID" >> $GITHUB_OUTPUT

      - name: Wait for pod and resolve URLs
        id: wait
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          set -euo pipefail
          POD_ID="${{ steps.deploy.outputs.pod_id }}"

          echo "Polling pod $POD_ID..."
          for i in $(seq 1 30); do
            POD_JSON=$(curl -s -H "Authorization: Bearer $RUNPOD_API_KEY" \
              "https://rest.runpod.io/v1/pods/$POD_ID" 2>/dev/null || echo '{}')

            STATUS=$(echo "$POD_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin).get('desiredStatus',''))" 2>/dev/null || echo "")
            PUBLIC_IP=$(echo "$POD_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin).get('publicIp','') or '')" 2>/dev/null || echo "")

            echo "  attempt $i/30: status=$STATUS ip=$PUBLIC_IP"

            if [ "$STATUS" = "RUNNING" ] && [ -n "$PUBLIC_IP" ]; then
              REDIS_PORT=$(echo "$POD_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin).get('portMappings',{}).get('6379',''))" 2>/dev/null || echo "")
              echo "pod_ip=$PUBLIC_IP"         >> $GITHUB_OUTPUT
              echo "redis_port=$REDIS_PORT"    >> $GITHUB_OUTPUT
              echo "hivemind_url=https://${POD_ID}-9100.proxy.runpod.net" >> $GITHUB_OUTPUT
              echo "vexa_url=https://${POD_ID}-8056.proxy.runpod.net"     >> $GITHUB_OUTPUT
              echo "meeting_api_url=https://${POD_ID}-8080.proxy.runpod.net" >> $GITHUB_OUTPUT
              echo "runtime_api_url=https://${POD_ID}-8090.proxy.runpod.net" >> $GITHUB_OUTPUT
              break
            fi
            sleep 10
          done

          [ -n "$PUBLIC_IP" ] || { echo "ERROR: pod did not reach RUNNING in time"; exit 1; }

      - name: Run smoke tests
        env:
          HIVEMIND_URL: ${{ steps.wait.outputs.hivemind_url }}
          VEXA_URL: ${{ steps.wait.outputs.vexa_url }}
          MEETING_API_URL: ${{ steps.wait.outputs.meeting_api_url }}
          RUNTIME_API_URL: ${{ steps.wait.outputs.runtime_api_url }}
        run: |
          chmod +x deployment/docker/scripts/ci-smoke-test.sh
          deployment/docker/scripts/ci-smoke-test.sh \
            "$HIVEMIND_URL" "$VEXA_URL" "ci-admin-token"

      - uses: dtolnay/rust-toolchain@stable

      - name: Hivemind integration tests
        env:
          HIVEMIND_URL: ${{ steps.wait.outputs.hivemind_url }}
          DATABASE_URL: postgres://kioku:kioku@${{ steps.wait.outputs.pod_ip }}:5432/kioku
        run: cargo test --manifest-path services/hivemind/tests/Cargo.toml -p kioku-hivemind-integration-tests -- --test-threads=1

      - name: CLI integration tests
        env:
          HIVEMIND_URL: ${{ steps.wait.outputs.hivemind_url }}
        run: cargo test --manifest-path services/cli/Cargo.toml -p cc-kioku --test integration_test --features integration

      - name: Destroy test pod
        if: always() && steps.deploy.outputs.pod_id != ''
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          curl -sf -X DELETE \
            -H "Authorization: Bearer $RUNPOD_API_KEY" \
            "https://rest.runpod.io/v1/pods/${{ steps.deploy.outputs.pod_id }}" || true
          echo "Pod ${{ steps.deploy.outputs.pod_id }} terminated"
