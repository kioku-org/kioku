name: Build and Push Docker Images

on:
  push:
    branches: [main, master]
    paths:
      - 'services/**'
      - 'deployment/runpod/Dockerfile.*'
      - 'deployment/runpod/entrypoint-*.sh'
      - '.github/workflows/build-images.yml'
      - '.github/workflows/runpod-test.yml'
  release:
    types: [published]

jobs:
  build-stateful:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          if [ "${GITHUB_REF##*/}" = "master" ] || [ "${GITHUB_REF##*/}" = "main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT
          fi

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/runpod/Dockerfile.stateful
          push: true
          tags: |
            kyomoto/kioku-stateful:${{ steps.meta.outputs.tag }}
            kyomoto/kioku-stateful:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=stateful
          cache-to: type=gha,scope=stateful,mode=max,ignore-error=true

  build-stateless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          if [ "${GITHUB_REF##*/}" = "master" ] || [ "${GITHUB_REF##*/}" = "main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT
          fi

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/runpod/Dockerfile.stateless
          push: true
          tags: |
            kyomoto/kioku-stateless:${{ steps.meta.outputs.tag }}
            kyomoto/kioku-stateless:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=stateless
          cache-to: type=gha,scope=stateless,mode=max,ignore-error=true

  build-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          if [ "${GITHUB_REF##*/}" = "master" ] || [ "${GITHUB_REF##*/}" = "main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT
          fi

      - uses: docker/build-push-action@v5
        with:
          context: services/dashboard
          file: services/dashboard/Dockerfile
          push: true
          build-args: |
            KIOKU_API_URL=http://vexa-api-gateway:8000
          tags: |
            ghcr.io/kioku-org/kioku-dashboard:${{ steps.meta.outputs.tag }}
            ghcr.io/kioku-org/kioku-dashboard:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,scope=dashboard,mode=max,ignore-error=true
