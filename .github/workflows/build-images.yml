name: Build and Push Docker Images

on:
  push:
    branches: [main, master]
    paths:
      - 'services/**'
      - 'deployment/docker/Dockerfile.*'
      - 'deployment/docker/entrypoint-*.sh'
      - '.github/workflows/build-images.yml'
  release:
    types: [published]

jobs:
  build-stateful:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          if [ "${GITHUB_REF##*/}" = "master" ] || [ "${GITHUB_REF##*/}" = "main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT
          fi

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/Dockerfile.stateful
          push: true
          tags: |
            ghcr.io/kioku-org/kioku-stateful:${{ steps.meta.outputs.tag }}
            ghcr.io/kioku-org/kioku-stateful:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=stateful
          cache-to: type=gha,scope=stateful,mode=max,ignore-error=true

  build-stateless:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          if [ "${GITHUB_REF##*/}" = "master" ] || [ "${GITHUB_REF##*/}" = "main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT
          fi

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/Dockerfile.stateless
          push: true
          tags: |
            ghcr.io/kioku-org/kioku-stateless:${{ steps.meta.outputs.tag }}
            ghcr.io/kioku-org/kioku-stateless:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=stateless
          cache-to: type=gha,scope=stateless,mode=max,ignore-error=true
