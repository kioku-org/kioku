name: Dashboard & MCP Tests

on:
  push:
    branches: [main, master]
    paths:
      - 'services/dashboard/**'
      - 'services/mcp/**'
      - '.github/workflows/dashboard-mcp.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'services/dashboard/**'
      - 'services/mcp/**'

jobs:
  dashboard-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: services/dashboard/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run unit tests
        run: npx vitest run

  mcp-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/mcp
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: services/mcp/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run unit tests
        run: pytest tests/ -v

  dashboard-build:
    runs-on: ubuntu-latest
    needs: [dashboard-unit]
    defaults:
      run:
        working-directory: services/dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: services/dashboard/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate release version
        run: NEXT_PUBLIC_VEXA_OSS_VERSION="0.1.0" node scripts/generate-release-version.js

      - name: Build
        run: npm run build
        env:
          KIOKU_API_URL: http://localhost:8056

  mcp-lint:
    runs-on: ubuntu-latest
    needs: [mcp-unit]
    defaults:
      run:
        working-directory: services/mcp
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: services/mcp/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .
