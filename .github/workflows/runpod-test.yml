name: RunPod Integration Test

on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: 'Short or full Git SHA whose published images should be tested'
        required: true
        type: string
  workflow_run:
    workflows: ["Build and Push Docker Images"]
    types: [completed]
    branches: [master, main]

jobs:
  runpod-test:
    runs-on: ubuntu-latest
    environment: dev
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve image tags
        id: images
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            RAW_SHA="${{ github.event.workflow_run.head_sha }}"
          else
            RAW_SHA="${{ inputs.image_sha }}"
          fi

          SHORT_SHA="${RAW_SHA:0:7}"
          if [ -z "$SHORT_SHA" ]; then
            echo "ERROR: could not resolve image SHA"
            exit 1
          fi

          echo "Testing published images for SHA: $SHORT_SHA"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "stateful_image=ghcr.io/kioku-org/kioku-stateful:$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "stateless_image=ghcr.io/kioku-org/kioku-stateless:$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for published images
        env:
          STATEFUL_IMAGE: ${{ steps.images.outputs.stateful_image }}
          STATELESS_IMAGE: ${{ steps.images.outputs.stateless_image }}
        run: |
          set -euo pipefail

          wait_for_image() {
            local image="$1"
            local name="$2"
            local max_tries="${3:-30}"

            for try in $(seq 1 "$max_tries"); do
              if docker manifest inspect "$image" >/dev/null 2>&1; then
                echo "  PASS: $name is published as $image"
                return 0
              fi
              echo "  ... $name not visible yet as $image (try $try/$max_tries), retrying in 10s..."
              sleep 10
            done

            echo "ERROR: $name image not published in time: $image"
            exit 1
          }

          echo "=== Waiting for published Docker images ==="
          wait_for_image "$STATEFUL_IMAGE" "Stateful image"
          wait_for_image "$STATELESS_IMAGE" "Stateless image"

      - name: Deploy stateful pod
        id: deploy
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          STATEFUL_IMAGE: ${{ steps.images.outputs.stateful_image }}
          STATELESS_IMAGE: ${{ steps.images.outputs.stateless_image }}
        run: |
          set -euo pipefail

          if [ -z "$RUNPOD_API_KEY" ]; then
            echo "ERROR: RUNPOD_API_KEY secret is not set"
            exit 1
          fi

          POD_NAME="ci-kioku-stateful-${GITHUB_SHA::7}"
          JWT_SECRET=$(openssl rand -hex 32)
          ENC_SECRET=$(openssl rand -hex 32)

          echo "Creating CPU pod: $POD_NAME"

          PAYLOAD=$(cat <<EOF
          {
            "name": "$POD_NAME",
            "imageName": "$STATEFUL_IMAGE",
            "computeType": "CPU",
            "vcpuCount": 4,
            "containerDiskInGb": 20,
            "ports": ["22/tcp", "6379/tcp", "8080/http", "8090/http", "9100/http", "8056/http", "11434/http"],
            "env": {
              "DB_NAME": "kioku",
              "DB_USER": "kioku",
              "DB_PASSWORD": "kioku",
              "REDIS_PASSWORD": "ci-test-redis-password",
              "HIVEMIND_JWT_SECRET": "$JWT_SECRET",
              "HIVEMIND_ENCRYPTION_SECRET": "$ENC_SECRET",
              "VEXA_ADMIN_API_TOKEN": "ci-test-admin-token",
              "INTERNAL_API_SECRET": "ci-test-internal-secret",
              "ORCHESTRATOR_BACKEND": "runpod",
              "RUNPOD_ACCOUNT_API_KEY": "$RUNPOD_API_KEY",
              "BOT_IMAGE": "$STATELESS_IMAGE",
              "BROWSER_IMAGE": "$STATELESS_IMAGE",
              "VEXA_PUBLIC_URL": "http://localhost:8056",
              "CORS_ORIGINS": "*",
              "LOG_LEVEL": "INFO",
              "VEXA_ENV": "production",
              "STORAGE_BACKEND": "minio",
              "MINIO_ACCESS_KEY": "kioku",
              "MINIO_SECRET_KEY": "ci-test-minio-password",
              "MINIO_BUCKET": "vexa-recordings",
              "RECORDING_ENABLED": "false",
              "RUNPOD_GPU_TYPE": "NVIDIA GeForce RTX 3090",
              "RUNPOD_GPU_TYPES": "NVIDIA GeForce RTX 3090,NVIDIA GeForce RTX 5090,NVIDIA RTX A5000,NVIDIA RTX A4000",
              "RUNPOD_CLOUD_TYPE": "COMMUNITY"
            }
          }
          EOF
          )

          RESP=$(curl -s -w "\n%{http_code}" -X POST "https://rest.runpod.io/v1/pods" \
            -H "Authorization: Bearer $RUNPOD_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          HTTP_CODE=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | head -n -1)
          echo "HTTP $HTTP_CODE"
          echo "Response: $BODY"

          POD_ID=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || echo "")

          if [ -z "$POD_ID" ]; then
            echo "Create returned $HTTP_CODE, searching for pod by name..."
            sleep 10
            POD_ID=$(curl -s -H "Authorization: Bearer $RUNPOD_API_KEY" \
              "https://rest.runpod.io/v1/pods?name=$POD_NAME" 2>/dev/null | \
              python3 -c "import sys,json; pods=json.load(sys.stdin); print(pods[0]['id'] if pods else '')" 2>/dev/null || echo "")
          fi

          if [ -z "$POD_ID" ]; then
            echo "ERROR: Could not find pod ID"
            exit 1
          fi

          echo "Pod ID: $POD_ID"
          echo "pod_id=$POD_ID" >> $GITHUB_OUTPUT
          echo "pod_name=$POD_NAME" >> $GITHUB_OUTPUT

      - name: Wait for pod and get port mappings
        id: wait
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          set -euo pipefail
          POD_ID="${{ steps.deploy.outputs.pod_id }}"

          echo "Polling pod $POD_ID status..."
          MAX_WAIT=300
          ELAPSED=0

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            POD_JSON=$(curl -s -H "Authorization: Bearer $RUNPOD_API_KEY" \
              "https://rest.runpod.io/v1/pods/$POD_ID" 2>/dev/null || echo '{}')

            DESIRED=$(echo "$POD_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('desiredStatus','UNKNOWN'))" 2>/dev/null || echo "UNKNOWN")
            PUBLIC_IP=$(echo "$POD_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('publicIp','') or '')" 2>/dev/null || echo "")
            PORT_MAPS=$(echo "$POD_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); pm=d.get('portMappings') or {}; print(','.join(f'{k}={v}' for k,v in pm.items()))" 2>/dev/null || echo "")

            echo "  [$ELAPSED/${MAX_WAIT}s] desiredStatus=$DESIRED publicIp=$PUBLIC_IP portMappings=$PORT_MAPS"

            if [ "$DESIRED" = "RUNNING" ] && [ -n "$PUBLIC_IP" ] && [ -n "$PORT_MAPS" ]; then
              echo "Pod is running at $PUBLIC_IP"
              echo "pod_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT

              # Extract mapped public ports for TCP connections
              REDIS_PUBLIC_PORT=$(echo "$POD_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('portMappings',{}).get('6379',''))" 2>/dev/null || echo "")
              EMBEDDING_PUBLIC_PORT=$(echo "$POD_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('portMappings',{}).get('11434',''))" 2>/dev/null || echo "")
              echo "redis_public_port=$REDIS_PUBLIC_PORT" >> $GITHUB_OUTPUT
              echo "embedding_public_port=$EMBEDDING_PUBLIC_PORT" >> $GITHUB_OUTPUT

              # HTTP ports use RunPod proxy URLs: https://<pod-id>-<port>.proxy.runpod.net
              echo "hivemind_url=https://${POD_ID}-9100.proxy.runpod.net" >> $GITHUB_OUTPUT
              echo "meeting_api_url=https://${POD_ID}-8080.proxy.runpod.net" >> $GITHUB_OUTPUT
              echo "vexa_gateway_url=https://${POD_ID}-8056.proxy.runpod.net" >> $GITHUB_OUTPUT
              echo "runtime_api_url=https://${POD_ID}-8090.proxy.runpod.net" >> $GITHUB_OUTPUT
              break
            fi

            sleep 10
            ELAPSED=$((ELAPSED + 10))
          done

          if [ $ELAPSED -ge $MAX_WAIT ]; then
            echo "ERROR: Pod did not reach RUNNING state in ${MAX_WAIT}s"
            exit 1
          fi

      - name: Health checks
        env:
          POD_IP: ${{ steps.wait.outputs.pod_ip }}
          REDIS_PUBLIC_PORT: ${{ steps.wait.outputs.redis_public_port }}
          EMBEDDING_PUBLIC_PORT: ${{ steps.wait.outputs.embedding_public_port }}
          HIVEMIND_URL: ${{ steps.wait.outputs.hivemind_url }}
          MEETING_API_URL: ${{ steps.wait.outputs.meeting_api_url }}
          VEXA_GATEWAY_URL: ${{ steps.wait.outputs.vexa_gateway_url }}
          RUNTIME_API_URL: ${{ steps.wait.outputs.runtime_api_url }}
        run: |
          set -euo pipefail

          FAIL=0

          check_http_retry() {
            local url="$1" name="$2" max_tries="${3:-12}" expected_code="${4:-200}"
            local try=1
            while [ $try -le $max_tries ]; do
              local code
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$url" 2>/dev/null || echo "000")
              if [ "$code" = "$expected_code" ]; then
                echo "  PASS: $name (HTTP $code, try $try)"
                return 0
              fi
              echo "  ... $name: HTTP $code (try $try/$max_tries), retrying in 10s..."
              sleep 10
              try=$((try + 1))
            done
            local final_code
            final_code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$url" 2>/dev/null || echo "000")
            echo "  FAIL: $name (HTTP $final_code after $max_tries tries)"
            FAIL=$((FAIL + 1))
          }

          check_tcp_retry() {
            local host="$1" port="$2" name="$3" max_tries="${4:-12}"
            local try=1
            while [ $try -le $max_tries ]; do
              if timeout 10 bash -c "echo > /dev/tcp/$host/$port" 2>/dev/null; then
                echo "  PASS: $name (TCP $host:$port, try $try)"
                return 0
              fi
              echo "  ... $name: TCP $host:$port not ready (try $try/$max_tries), retrying in 10s..."
              sleep 10
              try=$((try + 1))
            done
            echo "  FAIL: $name (TCP $host:$port after $max_tries tries)"
            FAIL=$((FAIL + 1))
          }

          check_redis_auth_retry() {
            local host="$1" port="$2" password="$3" max_tries="${4:-12}"
            local try=1
            while [ $try -le $max_tries ]; do
              local redis_resp
              redis_resp=$(timeout 10 bash -c '
                exec 3<>"/dev/tcp/'"$host"'/'"$port"'"
                printf "*2\r\n\$4\r\nAUTH\r\n\$'"${#password}"'\r\n'"$password"'\r\n" >&3
                IFS= read -r AUTH_REPLY <&3 || true
                printf "*1\r\n\$4\r\nPING\r\n" >&3
                IFS= read -r PING_REPLY <&3 || true
                exec 3<&-
                exec 3>&-
                printf "AUTH=%s PING=%s\n" "${AUTH_REPLY%$'\''\r'\''}" "${PING_REPLY%$'\''\r'\''}"
              ' 2>&1 || true)
              if echo "$redis_resp" | grep -q "AUTH=+OK PING=+PONG"; then
                echo "  PASS: Redis AUTH ($redis_resp, try $try)"
                return 0
              fi
              echo "  ... Redis AUTH: $redis_resp (try $try/$max_tries), retrying in 10s..."
              sleep 10
              try=$((try + 1))
            done
            echo "  FAIL: Redis AUTH (host=$host port=$port after $max_tries tries)"
            FAIL=$((FAIL + 1))
          }

          echo "=== HTTP endpoints (via RunPod proxy, with retries) ==="
          check_http_retry "$HIVEMIND_URL/health" "Hivemind API" 18 200
          check_http_retry "$MEETING_API_URL/health" "Vexa Meeting API" 18 200
          check_http_retry "$VEXA_GATEWAY_URL/" "Vexa API Gateway" 18 200
          check_http_retry "$RUNTIME_API_URL/health" "Runtime API" 18 200
          if [ -n "$EMBEDDING_PUBLIC_PORT" ]; then
            check_http_retry "http://$POD_IP:$EMBEDDING_PUBLIC_PORT/api/tags" "Ollama embedding API" 18 200
          else
            echo "  SKIP: Ollama embedding API (no port mapping)"
          fi

          echo ""
          echo "=== TCP ports (via mapped public ports) ==="
          if [ -n "$REDIS_PUBLIC_PORT" ]; then
            check_tcp_retry "$POD_IP" "$REDIS_PUBLIC_PORT" "Redis" 18
          else
            echo "  SKIP: Redis (no port mapping)"
          fi

          echo ""
          echo "=== Redis AUTH ==="
          if [ -n "$REDIS_PUBLIC_PORT" ]; then
            check_redis_auth_retry "$POD_IP" "$REDIS_PUBLIC_PORT" "ci-test-redis-password" 18
          else
            echo "  SKIP: Redis AUTH (no port mapping)"
          fi

          echo ""
          echo "=== Hivemind auth (with retries) ==="
          TOKEN=""
          for i in $(seq 1 12); do
            REG_RESP=$(curl -s -X POST "$HIVEMIND_URL/auth/register/admin" \
              -H "Content-Type: application/json" \
              -d '{"company_name":"ci-test","email":"ci@test.com","name":"CI","password":"testpassword123"}' \
              --max-time 20 2>/dev/null || echo '{}')
            TOKEN=$(echo "$REG_RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('token',''))" 2>/dev/null || echo "")
            if [ -n "$TOKEN" ]; then
              break
            fi
            echo "  ... registration try $i/12 failed, retrying in 10s..."
            sleep 10
          done

          if [ -n "$TOKEN" ]; then
            echo "  PASS: Hivemind admin registration"
            ME_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$HIVEMIND_URL/auth/me" \
              -H "Authorization: Bearer $TOKEN" --max-time 15)
            [ "$ME_CODE" = "200" ] && echo "  PASS: /auth/me (200)" || { echo "  FAIL: /auth/me ($ME_CODE)"; FAIL=$((FAIL + 1)); }
          else
            echo "  FAIL: Hivemind admin registration"
            FAIL=$((FAIL + 1))
          fi

          echo ""
          echo "========================================="
          if [ $FAIL -eq 0 ]; then
            echo "ALL HEALTH CHECKS PASSED"
          else
            echo "$FAIL CHECK(S) FAILED"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - name: Run hivemind integration tests
        env:
          HIVEMIND_URL: ${{ steps.wait.outputs.hivemind_url }}
          EMBEDDING_API_URL: http://${{ steps.wait.outputs.pod_ip }}:${{ steps.wait.outputs.embedding_public_port }}
          DATABASE_URL: postgres://kioku:kioku@${{ steps.wait.outputs.pod_ip }}:5432/kioku
        run: |
          set -euo pipefail
          cargo test --manifest-path services/hivemind/tests/Cargo.toml -p kioku-hivemind-integration-tests 2>&1
        working-directory: .

      - name: Run CLI integration tests
        env:
          HIVEMIND_URL: ${{ steps.wait.outputs.hivemind_url }}
        run: |
          set -euo pipefail
          cargo test --manifest-path services/cli/Cargo.toml -p cc-kioku --test integration_test --features integration 2>&1
        working-directory: .

      - name: Spawn stateless bot pod via runtime-api
        id: stateless
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          POD_IP: ${{ steps.wait.outputs.pod_ip }}
          REDIS_PUBLIC_PORT: ${{ steps.wait.outputs.redis_public_port }}
          RUNTIME_API_URL: ${{ steps.wait.outputs.runtime_api_url }}
          STATELESS_IMAGE: ${{ steps.images.outputs.stateless_image }}
        run: |
          set -euo pipefail

          if [ -z "$REDIS_PUBLIC_PORT" ]; then
            echo "ERROR: Redis public port is required for stateless pod validation"
            exit 1
          fi

          CREATE_RESP=$(curl -s -X POST "$RUNTIME_API_URL/containers" \
            -H "Content-Type: application/json" \
            -d @- <<EOF
          {
            "profile": "meeting",
            "user_id": "ci-runpod",
            "config": {
              "meeting_id": "999001",
              "env": {
                "REDIS_URL": "redis://:ci-test-redis-password@${POD_IP}:${REDIS_PUBLIC_PORT}/0",
                "TRANSCRIPTION_SERVICE_URL": "http://localhost",
                "TRANSCRIPTION_SERVICE_TOKEN": "",
                "TTS_SERVICE_URL": "http://localhost",
                "INTERNAL_API_SECRET": "ci-test-internal-secret"
              }
            },
            "metadata": {
              "meeting_id": 999001,
              "test_run": true
            }
          }
          EOF
          )

          CONTAINER_NAME=$(echo "$CREATE_RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('name',''))" 2>/dev/null || echo "")
          CONTAINER_ID=$(echo "$CREATE_RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('container_id',''))" 2>/dev/null || echo "")

          if [ -z "$CONTAINER_NAME" ] || [ -z "$CONTAINER_ID" ]; then
            echo "ERROR: Failed to spawn stateless pod"
            echo "$CREATE_RESP"
            exit 1
          fi

          echo "container_name=$CONTAINER_NAME" >> $GITHUB_OUTPUT
          echo "container_id=$CONTAINER_ID" >> $GITHUB_OUTPUT

          MAX_WAIT=180
          ELAPSED=0

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            POD_JSON=$(curl -s -H "Authorization: Bearer $RUNPOD_API_KEY" \
              "https://rest.runpod.io/v1/pods/$CONTAINER_ID" 2>/dev/null || echo '{}')

            GPU_COUNT=$(echo "$POD_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('gpuCount',''))" 2>/dev/null || echo "")
            IMAGE_NAME=$(echo "$POD_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('imageName',''))" 2>/dev/null || echo "")
            STATUS=$(echo "$POD_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('desiredStatus',''))" 2>/dev/null || echo "")

            echo "  [$ELAPSED/${MAX_WAIT}s] desiredStatus=$STATUS gpuCount=$GPU_COUNT imageName=$IMAGE_NAME"

            if [ "$GPU_COUNT" = "1" ] && [ "$IMAGE_NAME" = "$STATELESS_IMAGE" ]; then
              echo "Stateless pod allocation looks correct"
              break
            fi

            sleep 10
            ELAPSED=$((ELAPSED + 10))
          done

          if [ $ELAPSED -ge $MAX_WAIT ]; then
            echo "ERROR: Stateless pod did not materialize as a GPU pod in time"
            exit 1
          fi

      - name: Cleanup pod
        if: always()
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          STATELESS_NAME="${{ steps.stateless.outputs.container_name }}"
          STATELESS_ID="${{ steps.stateless.outputs.container_id }}"
          RUNTIME_API_URL="${{ steps.wait.outputs.runtime_api_url }}"

          if [ -n "$STATELESS_NAME" ] && [ -n "$RUNTIME_API_URL" ]; then
            echo "Deleting stateless container $STATELESS_NAME via runtime-api..."
            curl -s -X DELETE "$RUNTIME_API_URL/containers/$STATELESS_NAME" || true
          elif [ -n "$STATELESS_ID" ]; then
            echo "Deleting stateless pod $STATELESS_ID directly..."
            curl -s -X DELETE -H "Authorization: Bearer $RUNPOD_API_KEY" \
              "https://rest.runpod.io/v1/pods/$STATELESS_ID" || true
          fi

          POD_ID="${{ steps.deploy.outputs.pod_id }}"
          if [ -n "$POD_ID" ]; then
            echo "Deleting pod $POD_ID..."
            curl -s -X DELETE -H "Authorization: Bearer $RUNPOD_API_KEY" \
              "https://rest.runpod.io/v1/pods/$POD_ID" || true
            echo "Done."
          fi
