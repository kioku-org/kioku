name: RunPod Integration Test

on:
  push:
    branches: [master, main]
    paths:
      - 'services/**'
      - 'deployment/runpod/**'
      - '.github/workflows/build-images.yml'
      - '.github/workflows/runpod-test.yml'
  workflow_run:
    workflows: ["Build and Push Docker Images"]
    types: [completed]
    branches: [master, main]

jobs:
  runpod-test:
    runs-on: ubuntu-latest
    environment: dev
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install runpodctl
        run: |
          curl -sSL https://github.com/runpod/runpodctl/releases/latest/download/runpodctl-linux-amd64 -o /usr/local/bin/runpodctl
          chmod +x /usr/local/bin/runpodctl
          runpodctl version

      - name: Deploy stateful pod
        id: deploy
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$RUNPOD_API_KEY" ]; then
            echo "ERROR: RUNPOD_API_KEY secret is not set"
            exit 1
          fi

          POD_NAME="ci-kioku-stateful-${GITHUB_SHA::7}"
          JWT_SECRET=$(openssl rand -hex 32)
          ENC_SECRET=$(openssl rand -hex 32)

          ENV_JSON=$(cat <<EOF
          {"DB_NAME":"kioku","DB_USER":"kioku","DB_PASSWORD":"kioku","REDIS_PASSWORD":"ci-test-redis-password","HIVEMIND_JWT_SECRET":"$JWT_SECRET","HIVEMIND_ENCRYPTION_SECRET":"$ENC_SECRET","VEXA_ADMIN_API_TOKEN":"ci-test-admin-token","INTERNAL_API_SECRET":"ci-test-internal-secret","ORCHESTRATOR_BACKEND":"runpod","RUNPOD_API_KEY":"$RUNPOD_API_KEY","BOT_IMAGE":"kyomoto/kioku-stateless:latest","VEXA_PUBLIC_URL":"http://localhost:8056","CORS_ORIGINS":"*","LOG_LEVEL":"INFO","VEXA_ENV":"production","STORAGE_BACKEND":"minio","MINIO_ACCESS_KEY":"kioku","MINIO_SECRET_KEY":"ci-test-minio-password","MINIO_BUCKET":"vexa-recordings","RECORDING_ENABLED":"false","RUNPOD_GPU_TYPE":"NVIDIA GeForce RTX 3090","RUNPOD_CLOUD_TYPE":"COMMUNITY"}
          EOF
          )

          echo "Creating CPU pod: $POD_NAME"

          runpodctl pod create \
            --name "$POD_NAME" \
            --image "kyomoto/kioku-stateful:latest" \
            --compute-type cpu \
            --container-disk-in-gb 40 \
            --ports "22/tcp,6379/tcp,8080/http,9100/http,8056/http" \
            --env "$ENV_JSON" \
            --cloud-type COMMUNITY \
            --public-ip \
            --terminate-after 1h

          echo "Waiting 10s for pod to register..."
          sleep 10

          POD_ID=$(runpodctl pod list --name "$POD_NAME" --all 2>&1 | grep "$POD_NAME" | awk '{print $1}' | head -1)

          if [ -z "$POD_ID" ]; then
            echo "ERROR: Could not find pod ID"
            runpodctl pod list --all 2>&1
            exit 1
          fi

          echo "Pod ID: $POD_ID"
          echo "pod_id=$POD_ID" >> $GITHUB_OUTPUT
          echo "pod_name=$POD_NAME" >> $GITHUB_OUTPUT

      - name: Wait for pod to be running
        id: wait
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          set -euo pipefail
          POD_ID="${{ steps.deploy.outputs.pod_id }}"

          echo "Polling pod $POD_ID status..."
          MAX_WAIT=300
          ELAPSED=0

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            POD_JSON=$(curl -s -H "Authorization: Bearer $RUNPOD_API_KEY" \
              "https://rest.runpod.io/v1/pods/$POD_ID" 2>/dev/null || echo '{}')

            DESIRED=$(echo "$POD_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('desiredStatus','UNKNOWN'))" 2>/dev/null || echo "UNKNOWN")
            PUBLIC_IP=$(echo "$POD_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('publicIp','') or '')" 2>/dev/null || echo "")

            echo "  [$ELAPSED/${MAX_WAIT}s] desiredStatus=$DESIRED publicIp=$PUBLIC_IP"

            if [ "$DESIRED" = "RUNNING" ] && [ -n "$PUBLIC_IP" ]; then
              echo "Pod is running at $PUBLIC_IP"
              echo "pod_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT
              break
            fi

            sleep 10
            ELAPSED=$((ELAPSED + 10))
          done

          if [ $ELAPSED -ge $MAX_WAIT ]; then
            echo "ERROR: Pod did not reach RUNNING state in ${MAX_WAIT}s"
            exit 1
          fi

      - name: Health checks
        env:
          POD_IP: ${{ steps.wait.outputs.pod_ip }}
        run: |
          set -euo pipefail
          echo "Waiting 30s for services to initialize..."
          sleep 30

          FAIL=0

          check_http() {
            local url="$1" name="$2"
            local code
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$url" 2>/dev/null || echo "000")
            if [ "$code" -ge 200 ] && [ "$code" -lt 500 ]; then
              echo "  PASS: $name (HTTP $code)"
            else
              echo "  FAIL: $name (HTTP $code)"
              FAIL=$((FAIL + 1))
            fi
          }

          check_tcp() {
            local host="$1" port="$2" name="$3"
            if timeout 5 bash -c "echo > /dev/tcp/$host/$port" 2>/dev/null; then
              echo "  PASS: $name (TCP $host:$port)"
            else
              echo "  FAIL: $name (TCP $host:$port)"
              FAIL=$((FAIL + 1))
            fi
          }

          echo "=== HTTP endpoints ==="
          check_http "http://$POD_IP:9100/health" "Hivemind API"
          check_http "http://$POD_IP:8080/health" "Vexa Meeting API"
          check_http "http://$POD_IP:8056/" "Vexa API Gateway"
          check_http "http://$POD_IP:8090/health" "Runtime API"

          echo ""
          echo "=== TCP ports ==="
          check_tcp "$POD_IP" 6379 "Redis"
          check_tcp "$POD_IP" 5432 "PostgreSQL"

          echo ""
          echo "=== Redis AUTH ==="
          REDIS_RESP=$(redis-cli -h "$POD_IP" -p 6379 -a "ci-test-redis-password" PING 2>/dev/null || echo "FAIL")
          if echo "$REDIS_RESP" | grep -q PONG; then
            echo "  PASS: Redis AUTH (PONG)"
          else
            echo "  FAIL: Redis AUTH ($REDIS_RESP)"
            FAIL=$((FAIL + 1))
          fi

          echo ""
          echo "=== Hivemind auth ==="
          REG_RESP=$(curl -s -X POST "http://$POD_IP:9100/auth/register/admin" \
            -H "Content-Type: application/json" \
            -d '{"company_name":"ci-test","email":"ci@test.com","name":"CI","password":"testpassword123"}' \
            --max-time 15 2>/dev/null || echo '{}')
          TOKEN=$(echo "$REG_RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('token',''))" 2>/dev/null || echo "")

          if [ -n "$TOKEN" ]; then
            echo "  PASS: Hivemind admin registration"
            ME_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://$POD_IP:9100/auth/me" \
              -H "Authorization: Bearer $TOKEN" --max-time 10)
            [ "$ME_CODE" = "200" ] && echo "  PASS: /auth/me (200)" || { echo "  FAIL: /auth/me ($ME_CODE)"; FAIL=$((FAIL + 1)); }
          else
            echo "  FAIL: Hivemind admin registration"
            FAIL=$((FAIL + 1))
          fi

          echo ""
          echo "========================================="
          if [ $FAIL -eq 0 ]; then
            echo "ALL HEALTH CHECKS PASSED"
          else
            echo "$FAIL CHECK(S) FAILED"
            exit 1
          fi

      - name: Cleanup pod
        if: always()
        run: |
          POD_ID="${{ steps.deploy.outputs.pod_id }}"
          if [ -n "$POD_ID" ]; then
            echo "Deleting pod $POD_ID..."
            runpodctl pod delete "$POD_ID" || true
            echo "Done."
          fi
