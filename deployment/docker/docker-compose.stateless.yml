name: kioku-stateless

services:
  vexa-api-gateway:
    build:
      context: ${KIOKU_VEXA_PATH:-../../services/vexa}
      dockerfile: services/api-gateway/Dockerfile
    container_name: kioku-vexa-api-gateway
    ports:
      - "${VEXA_API_PORT:-8056}:8000"
    environment:
      - ADMIN_API_URL=http://vexa-admin-api:8001
      - MEETING_API_URL=http://vexa-meeting-api:8080
      - TRANSCRIPTION_COLLECTOR_URL=http://vexa-meeting-api:8080
      - MCP_URL=http://kioku-mcp:18888
      - AGENT_API_URL=http://vexa-agent-api:8100
      - REDIS_URL=redis://vexa-redis:6379/0
      - PUBLIC_BASE_URL=${VEXA_PUBLIC_URL:-http://localhost:8056}
      - TRANSCRIPT_SHARE_TTL_SECONDS=900
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-}
      - VEXA_ENV=${VEXA_ENV:-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-kioku}
      - DB_USER=${DB_USER:-kioku}
      - DB_PASSWORD=${DB_PASSWORD:-kioku}
      - DB_SCHEMA=vexa
      - DB_SSL_MODE=disable
    init: true
    depends_on:
      vexa-admin-api:
        condition: service_started
      vexa-meeting-api:
        condition: service_started
    networks:
      - kioku-network
    restart: unless-stopped

  vexa-admin-api:
    build:
      context: ${KIOKU_VEXA_PATH:-../../services/vexa}
      dockerfile: services/admin-api/Dockerfile
    container_name: kioku-vexa-admin-api
    ports:
      - "${VEXA_ADMIN_PORT:-8057}:8001"
    environment:
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-kioku}
      - DB_USER=${DB_USER:-kioku}
      - DB_PASSWORD=${DB_PASSWORD:-kioku}
      - DB_SCHEMA=vexa
      - DB_SSL_MODE=disable
      - DB_POOL_SIZE=5
      - DB_MAX_OVERFLOW=5
      - DB_POOL_TIMEOUT=30
      - ADMIN_API_TOKEN=${VEXA_ADMIN_API_TOKEN}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-}
      - VEXA_ENV=${VEXA_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    init: true
    networks:
      - kioku-network
    restart: unless-stopped

  vexa-meeting-api:
    build:
      context: ${KIOKU_VEXA_PATH:-../../services/vexa}
      dockerfile: services/meeting-api/Dockerfile
    container_name: kioku-vexa-meeting-api
    environment:
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-kioku}
      - DB_USER=${DB_USER:-kioku}
      - DB_PASSWORD=${DB_PASSWORD:-kioku}
      - DB_SSL_MODE=disable
      - DB_POOL_SIZE=20
      - DB_MAX_OVERFLOW=20
      - DB_POOL_TIMEOUT=10
      - REDIS_URL=redis://vexa-redis:6379/0
      - REDIS_HOST=vexa-redis
      - REDIS_PORT=6379
      - REDIS_STREAM_NAME=transcription_segments
      - REDIS_CONSUMER_GROUP=collector_group
      - REDIS_STREAM_READ_COUNT=10
      - REDIS_STREAM_BLOCK_MS=2000
      - TRANSCRIPTION_COLLECTOR_URL=http://vexa-meeting-api:8080
      - TRANSCRIPTION_SERVICE_URL=http://vexa-transcription-service:80
      - REMOTE_TRANSCRIBER_URL=http://vexa-transcription-service:80/v1/audio/transcriptions
      - REMOTE_TRANSCRIBER_API_KEY=${VEXA_TRANSCRIBER_API_KEY:-}
      - TTS_SERVICE_URL=http://vexa-tts-service:8002
      - RUNTIME_API_URL=http://kioku-runtime-router:8090
      - MEETING_API_URL=http://vexa-meeting-api:8080
      - ADMIN_TOKEN=${VEXA_ADMIN_API_TOKEN}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - VEXA_ENV=${VEXA_ENV:-production}
      - ZOOM_CLIENT_ID=${ZOOM_CLIENT_ID:-}
      - ZOOM_CLIENT_SECRET=${ZOOM_CLIENT_SECRET:-}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-minio}
      - MINIO_ENDPOINT=vexa-minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-vexa-access-key}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-vexa-secret-key}
      - MINIO_BUCKET=${MINIO_BUCKET:-vexa-recordings}
      - MINIO_SECURE=false
      - RECORDING_ENABLED=${RECORDING_ENABLED:-false}
      - CAPTURE_MODES=audio
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - BOT_IMAGE_NAME=${VEXA_BOT_IMAGE:-ghcr.io/kioku-org/kioku-stateless:latest}
    volumes:
      - vexa-recordings-data:/data/recordings
    init: true
    depends_on:
      vexa-redis:
        condition: service_started
      vexa-tts-service:
        condition: service_started
      vexa-transcription-service:
        condition: service_started
      kioku-runtime-router:
        condition: service_started
    networks:
      - kioku-network
    restart: unless-stopped

  vexa-runtime-api-local:
    build:
      context: ${KIOKU_VEXA_PATH:-../../services/vexa}/services/runtime-api
      dockerfile: Dockerfile
    container_name: kioku-vexa-runtime-api-local
    group_add:
      - "${DOCKER_GID:-983}"
    environment:
      - ORCHESTRATOR_BACKEND=docker
      - REDIS_URL=redis://vexa-redis:6379/0
      - DOCKER_HOST=unix:///var/run/docker.sock
      - DOCKER_NETWORK=kioku-network
      - BROWSER_IMAGE=${VEXA_BOT_IMAGE:-ghcr.io/kioku-org/kioku-stateless:latest}
      - TRANSCRIPTION_SERVICE_URL=http://vexa-transcription-service:80
      - TRANSCRIPTION_SERVICE_TOKEN=${VEXA_TRANSCRIBER_API_KEY:-}
      - TTS_SERVICE_URL=http://vexa-tts-service:8002
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-}
      - PROFILES_PATH=/app/profiles.yaml
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ALLOW_PRIVATE_CALLBACKS=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./configs/runtime-profiles.yaml:/app/profiles.yaml:ro
    depends_on:
      vexa-redis:
        condition: service_started
    networks:
      - kioku-network
    restart: unless-stopped

  vexa-runtime-api-runpod:
    build:
      context: ${KIOKU_VEXA_PATH:-../../services/vexa}/services/runtime-api
      dockerfile: Dockerfile
    container_name: kioku-vexa-runtime-api-runpod
    environment:
      - ORCHESTRATOR_BACKEND=runpod
      - REDIS_URL=redis://vexa-redis:6379/0
      - TRANSCRIPTION_SERVICE_URL=http://vexa-transcription-service:80
      - TRANSCRIPTION_SERVICE_TOKEN=${VEXA_TRANSCRIBER_API_KEY:-}
      - TTS_SERVICE_URL=http://vexa-tts-service:8002
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-}
      - PROFILES_PATH=/app/profiles.yaml
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - RUNPOD_ACCOUNT_API_KEY=${RUNPOD_API_KEY:-}
      - RUNPOD_GPU_TYPES=${RUNPOD_GPU_TYPES:-NVIDIA GeForce RTX 3090,NVIDIA RTX A5000,NVIDIA RTX A4000}
      - RUNPOD_CLOUD_TYPE=${RUNPOD_CLOUD_TYPE:-COMMUNITY}
    volumes:
      - ./configs/runtime-profiles.yaml:/app/profiles.yaml:ro
    depends_on:
      vexa-redis:
        condition: service_started
    networks:
      - kioku-network
    restart: unless-stopped

  kioku-runtime-router:
    image: ghcr.io/kioku-org/kioku-runtime-router:latest
    container_name: kioku-runtime-router
    environment:
      - USE_LOCAL_RESOURCE=${USE_LOCAL_RESOURCE:-true}
      - LOCAL_BOT_THRESHOLD=${LOCAL_BOT_THRESHOLD:-3}
      - LOCAL_BACKEND_URL=http://vexa-runtime-api-local:8090
      - RUNPOD_BACKEND_URL=http://vexa-runtime-api-runpod:8090
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    init: true
    depends_on:
      vexa-runtime-api-local:
        condition: service_started
      vexa-runtime-api-runpod:
        condition: service_started
    networks:
      - kioku-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8090/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  vexa-agent-api:
    build:
      context: ${KIOKU_VEXA_PATH:-../../services/vexa}
      dockerfile: services/agent-api/Dockerfile
    container_name: kioku-vexa-agent-api
    environment:
      - REDIS_URL=redis://vexa-redis:6379/0
      - RUNTIME_API_URL=http://vexa-meeting-api:8080
      - ADMIN_API_URL=http://vexa-admin-api:8001
      - ADMIN_API_TOKEN=${VEXA_ADMIN_API_TOKEN:-}
      - AGENT_API_INTERNAL_URL=http://vexa-agent-api:8100
      - DOCKER_NETWORK=kioku-network
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-}
      - VEXA_ENV=${VEXA_ENV:-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    init: true
    networks:
      - kioku-network
    restart: unless-stopped

  vexa-transcription-service:
    build:
      context: ${KIOKU_VEXA_PATH:-../../services/vexa}/services/transcription-service
      dockerfile: Dockerfile
    container_name: kioku-vexa-transcription-service
    environment:
      - API_TOKEN=${VEXA_TRANSCRIBER_API_KEY:-}
      - MODEL_SIZE=large-v3-turbo
      - COMPUTE_TYPE=float16
      - DEVICE=cuda
      - VEXA_ENV=${VEXA_ENV:-production}
    expose:
      - "80"
    networks:
      - kioku-network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  kioku-mcp:
    image: ghcr.io/kioku-org/kioku-mcp:latest
    container_name: kioku-mcp
    ports:
      - "18888:18888"
    environment:
      - KIOKU_API_URL=http://vexa-api-gateway:8000
      - KIOKU_ENV=${KIOKU_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    init: true
    depends_on:
      vexa-api-gateway:
        condition: service_started
    networks:
      - kioku-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:18888/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  vexa-tts-service:
    build:
      context: ${KIOKU_VEXA_PATH:-../../services/vexa}
      dockerfile: services/tts-service/Dockerfile
    container_name: kioku-vexa-tts-service
    environment:
      - TTS_API_TOKEN=${TTS_API_TOKEN:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com}
      - VEXA_ENV=${VEXA_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    init: true
    expose:
      - "8002"
    networks:
      - kioku-network
    restart: unless-stopped

  vexa-redis:
    image: redis:7.0-alpine
    container_name: kioku-vexa-redis
    command:
      ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - vexa-redis-data:/data
    networks:
      - kioku-network
    restart: unless-stopped

  vexa-minio:
    image: minio/minio:latest
    container_name: kioku-vexa-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-vexa-access-key}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-vexa-secret-key}
    volumes:
      - vexa-minio-data:/data
    networks:
      - kioku-network
    restart: unless-stopped

  vexa-minio-init:
    image: minio/mc:latest
    container_name: kioku-vexa-minio-init
    depends_on:
      - vexa-minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set vexa http://vexa-minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do
          echo "Waiting for MinIO..."; sleep 3
        done
        mc mb --ignore-existing vexa/$${MINIO_BUCKET:-vexa-recordings}
        exit 0
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-vexa-access-key}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-vexa-secret-key}
    networks:
      - kioku-network

  ollama:
    image: ollama/ollama:latest
    container_name: kioku-ollama
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - kioku-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 12G
        reservations:
          memory: 1G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ollama-pull:
    image: ollama/ollama:latest
    container_name: kioku-ollama-pull
    depends_on:
      - ollama
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Pulling nomic-embed-text-v2-moe embedding model..."
        until ollama pull nomic-embed-text-v2-moe; do
          echo "Retrying pull in 10s..."
          sleep 10
        done
        echo "Model pull complete."
    environment:
      - OLLAMA_HOST=http://ollama:11434
    networks:
      - kioku-network
    restart: "no"

  kioku-hivemind:
    build:
      context: ${HIVEMIND_PATH:-../../services/hivemind}
    container_name: kioku-hivemind
    ports:
      - "${HIVEMIND_PORT:-9100}:9100"
    environment:
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-kioku}
      - DB_USER=${DB_USER:-kioku}
      - DB_PASSWORD=${DB_PASSWORD:-kioku}
      - DB_MAX_CONNECTIONS=10
      - DB_SCHEMA=hivemind
      - JWT_SECRET=${HIVEMIND_JWT_SECRET}
      - JWT_TTL_SECONDS=2592000
      - ENCRYPTION_SECRET=${HIVEMIND_ENCRYPTION_SECRET}
      - VEXA_API_URL=http://vexa-api-gateway:8000
      - VEXA_ADMIN_API_URL=http://vexa-admin-api:8001
      - VEXA_ADMIN_TOKEN=${VEXA_ADMIN_API_TOKEN}
      - HOST=0.0.0.0
      - PORT=9100
      - EMBEDDING_API_URL=http://ollama:11434
      - EMBEDDING_MODEL=nomic-embed-text-v2-moe
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6334}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
    depends_on:
      ollama:
        condition: service_started
      ollama-pull:
        condition: service_completed_successfully
    networks:
      - kioku-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9100/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  kioku-dashboard:
    image: ghcr.io/kioku-org/kioku-dashboard:latest
    container_name: kioku-dashboard
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOSTNAME=0.0.0.0
      - VEXA_API_URL=http://vexa-api-gateway:8000
      - VEXA_ADMIN_API_KEY=${VEXA_ADMIN_API_TOKEN}
      - VEXA_ADMIN_API_URL=http://vexa-admin-api:8001
      - VEXA_ALLOW_DIRECT_LOGIN=${VEXA_ALLOW_DIRECT_LOGIN:-true}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://dashboard.kioku.chat}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - AZURE_AD_CLIENT_ID=${AZURE_AD_CLIENT_ID:-}
      - AZURE_AD_CLIENT_SECRET=${AZURE_AD_CLIENT_SECRET:-}
      - AZURE_AD_TENANT_ID=${AZURE_AD_TENANT_ID:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - NEXT_PUBLIC_DOCS_URL=${NEXT_PUBLIC_DOCS_URL:-https://docs.kioku.chat}
    depends_on:
      vexa-api-gateway:
        condition: service_started
      vexa-admin-api:
        condition: service_started
    networks:
      - kioku-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: kioku-cloudflared
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared.yml:/etc/cloudflared/config.yml:ro
      - ${CLOUDFLARED_CREDENTIALS_DIR:-~/.cloudflared}:/etc/cloudflared/creds:ro
    depends_on:
      kioku-hivemind:
        condition: service_healthy
      vexa-api-gateway:
        condition: service_started
      kioku-dashboard:
        condition: service_started
      kioku-mcp:
        condition: service_started
    networks:
      - kioku-network
    restart: unless-stopped

volumes:
  vexa-redis-data:
    name: kioku-vexa-redis-data
  vexa-minio-data:
    name: kioku-vexa-minio-data
  vexa-recordings-data:
    name: kioku-vexa-recordings-data
  ollama-data:
    name: kioku-ollama-data


networks:
  kioku-network:
    name: kioku-network
    external: true
