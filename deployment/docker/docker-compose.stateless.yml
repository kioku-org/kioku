name: kioku-model-warmup

# One-shot job: pre-downloads the Whisper model to a host volume so every
# stateless bot pod can reuse it without re-downloading.
#
# Usage:
#   BOT_MODEL_CACHE_DIR=/opt/kioku/models docker compose -f docker-compose.stateless.yml run --rm model-warmup
#
# The same BOT_MODEL_CACHE_DIR must be set in docker-compose.stateful.yml so
# runtime-api-local mounts it into each spawned bot pod.

services:
  model-warmup:
    image: ghcr.io/kioku-org/kioku-stateless:latest
    container_name: model-warmup
    entrypoint:
      - python3
      - -c
      - |
        from faster_whisper import WhisperModel
        import os
        m = os.getenv("MODEL_SIZE", "large-v3-turbo")
        print(f"[warmup] downloading {m} ...")
        WhisperModel(m, download_root="/app/models", device="cpu", compute_type="int8")
        print("[warmup] done.")
    environment:
      - MODEL_SIZE=${BOT_WHISPER_MODEL:-large-v3-turbo}
    volumes:
      - ${BOT_MODEL_CACHE_DIR:-/opt/kioku/models}:/app/models
    restart: "no"
