name: kioku-stateful

services:
  kioku-stateful:
    image: ghcr.io/kioku-org/kioku-stateful:latest
    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile.stateful
    container_name: kioku-stateful
    group_add:
      - "${DOCKER_GID:-983}"
    ports:
      - "${VEXA_API_PORT:-8056}:8056"
      - "${HIVEMIND_PORT:-9100}:9100"
      - "3001:3001"
      - "18888:18888"
      - "2222:22"
    environment:
      # ── Database ──────────────────────────────────────────────────────────────
      - DB_USER=${DB_USER:-kioku}
      - DB_PASSWORD=${DB_PASSWORD:-kioku}
      - DB_NAME=${DB_NAME:-kioku}
      # ── Redis ─────────────────────────────────────────────────────────────────
      - REDIS_PASSWORD=${REDIS_PASSWORD:-kioku-redis}
      # ── Storage ───────────────────────────────────────────────────────────────
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-vexa-access-key}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-vexa-secret-key}
      - MINIO_BUCKET=${MINIO_BUCKET:-vexa-recordings}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-minio}
      - RECORDING_ENABLED=${RECORDING_ENABLED:-false}
      # ── Hivemind ──────────────────────────────────────────────────────────────
      - HIVEMIND_JWT_SECRET=${HIVEMIND_JWT_SECRET}
      - HIVEMIND_ENCRYPTION_SECRET=${HIVEMIND_ENCRYPTION_SECRET}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      # ── API + auth ────────────────────────────────────────────────────────────
      - VEXA_API_PORT=${VEXA_API_PORT:-8056}
      - VEXA_PUBLIC_URL=${VEXA_PUBLIC_URL:-http://localhost:8056}
      - VEXA_ADMIN_API_TOKEN=${VEXA_ADMIN_API_TOKEN}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - VEXA_ENV=${VEXA_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # ── Bot runtime ───────────────────────────────────────────────────────────
      - BOT_IMAGE=${VEXA_BOT_IMAGE:-ghcr.io/kioku-org/kioku-stateless:latest}
      - USE_LOCAL_RESOURCE=${USE_LOCAL_RESOURCE:-true}
      - LOCAL_BOT_THRESHOLD=${LOCAL_BOT_THRESHOLD:-3}
      - DOCKER_GID=${DOCKER_GID:-983}
      - BOT_MODEL_CACHE_DIR=${BOT_MODEL_CACHE_DIR:-}
      - BOT_WHISPER_MODEL=${BOT_WHISPER_MODEL:-}
      - BOT_MAX_TIME=${BOT_MAX_TIME:-}
      - BOT_MAX_TIME_LEFT_ALONE=${BOT_MAX_TIME_LEFT_ALONE:-}
      - BOT_MAX_WAIT_FOR_ADMISSION=${BOT_MAX_WAIT_FOR_ADMISSION:-}
      - BOT_NO_ONE_JOINED_TIMEOUT=${BOT_NO_ONE_JOINED_TIMEOUT:-}
      # ── RunPod ────────────────────────────────────────────────────────────────
      - RUNPOD_API_KEY=${RUNPOD_API_KEY:-}
      - RUNPOD_GPU_TYPES=${RUNPOD_GPU_TYPES:-NVIDIA GeForce RTX 3090,NVIDIA RTX A5000,NVIDIA RTX A4000}
      - RUNPOD_CLOUD_TYPE=${RUNPOD_CLOUD_TYPE:-COMMUNITY}
      # ── Cookie service ────────────────────────────────────────────────────────
      - COOKIE_SERVICE_TOKEN=${COOKIE_SERVICE_TOKEN:-}
      # ── Integrations ──────────────────────────────────────────────────────────
      - VEXA_TRANSCRIBER_API_KEY=${VEXA_TRANSCRIBER_API_KEY:-}
      - ZOOM_CLIENT_ID=${ZOOM_CLIENT_ID:-}
      - ZOOM_CLIENT_SECRET=${ZOOM_CLIENT_SECRET:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - TTS_API_TOKEN=${TTS_API_TOKEN:-}
      # ── Dashboard ─────────────────────────────────────────────────────────────
      - AI_MODEL=${AI_MODEL:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://dashboard.kioku.chat}
      - VEXA_PUBLIC_API_URL=${VEXA_PUBLIC_API_URL:-https://meetings.kioku.chat}
      - VEXA_ALLOW_DIRECT_LOGIN=${VEXA_ALLOW_DIRECT_LOGIN:-true}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - AZURE_AD_CLIENT_ID=${AZURE_AD_CLIENT_ID:-}
      - AZURE_AD_CLIENT_SECRET=${AZURE_AD_CLIENT_SECRET:-}
      - AZURE_AD_TENANT_ID=${AZURE_AD_TENANT_ID:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - NEXT_PUBLIC_DOCS_URL=${NEXT_PUBLIC_DOCS_URL:-https://docs.kioku.chat}
      # ── SSH (optional, for RunPod terminal access) ────────────────────────────
      - PUBLIC_KEY=${PUBLIC_KEY:-}
      # ── GPU (Ollama + Qdrant GPU indexing) ────────────────────────────────────
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
    devices:
      # nvidia-container-toolkit's own DRM render-node auto-injection doesn't
      # work on this host (hybrid Intel/NVIDIA GPU setup) despite the
      # "graphics" capability above, so /dev/dri needs to be passed through
      # directly for Qdrant's Vulkan GPU indexing to find a device. Safe to
      # expose both cards: only the NVIDIA Vulkan ICD is registered in
      # /etc/vulkan/icd.d/, so Vulkan can't pick the Intel one by mistake.
      - /dev/dri:/dev/dri
      - /dev/nvidia-modeset:/dev/nvidia-modeset
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - postgres-data:/data/postgresql
      - qdrant-data:/data/qdrant
      - redis-data:/data/redis
      - minio-data:/data/minio
      - ollama-data:/data/ollama/models
      - cookie-data:/data/cookie
      - recordings-data:/data/recordings
      - ./configs/runtime-profiles.yaml:/app/profiles.yaml:ro
      - ./cloudflared.yml:/etc/cloudflared/config.yml:ro
      - ${CLOUDFLARED_CREDENTIALS_DIR:-~/.cloudflared}:/etc/cloudflared/creds:ro
    networks:
      - kioku-network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8056/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  postgres-data:
    name: kioku-postgres-data
  qdrant-data:
    name: kioku-qdrant-data
  redis-data:
    name: kioku-redis-data
  minio-data:
    name: kioku-minio-data
  ollama-data:
    name: kioku-ollama-data
  cookie-data:
    name: kioku-cookie-data
  recordings-data:
    name: kioku-recordings-data

networks:
  kioku-network:
    name: kioku-network
    driver: bridge
