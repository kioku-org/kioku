[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[program:postgresql]
command=/usr/lib/postgresql/14/bin/postgres -D /var/lib/postgresql/data
user=postgres
autostart=true
autorestart=true
stdout_logfile=/var/log/postgresql.log
stderr_logfile=/var/log/postgresql-err.log

[program:redis]
command=redis-server --appendonly yes --appendfsync everysec
autostart=true
autorestart=true
stdout_logfile=/var/log/redis.log
stderr_logfile=/var/log/redis-err.log

[program:qdrant]
command=/usr/local/bin/qdrant --storage-path /workspace/data/qdrant
autostart=true
autorestart=true
stdout_logfile=/var/log/qdrant.log
stderr_logfile=/var/log/qdrant-err.log

[program:ollama]
command=/usr/local/bin/ollama serve
environment=OLLAMA_HOST="0.0.0.0:11434"
autostart=true
autorestart=true
stdout_logfile=/var/log/ollama.log
stderr_logfile=/var/log/ollama-err.log

[program:kioku-hivemind]
command=/usr/local/bin/kioku-hivemind
environment=DB_HOST="localhost",DB_PORT="5432",DB_NAME="kioku",DB_USER="kioku",DB_PASSWORD="kioku",DB_SCHEMA="hivemind",HOST="0.0.0.0",PORT="9100",EMBEDDING_API_URL="http://localhost:11434",EMBEDDING_MODEL="nomic-embed-text-v2-moe",QDRANT_URL="http://localhost:6334",VEXA_API_URL="http://localhost:8000",VEXA_ADMIN_API_URL="http://localhost:8001",JWT_SECRET="runpod-jwt-secret-change-me",ENCRYPTION_SECRET="runpod-encryption-secret-change-me"
autostart=true
autorestart=true
stdout_logfile=/var/log/hivemind.log
stderr_logfile=/var/log/hivemind-err.log

[program:vexa-api-gateway]
command=python3 -m uvicorn main:app --host 0.0.0.0 --port 8000
directory=/workspace/kioku/services/voice/services/api-gateway
environment=ADMIN_API_URL="http://localhost:8001",MEETING_API_URL="http://localhost:8080",TRANSCRIPTION_COLLECTOR_URL="http://localhost:8080",MCP_URL="http://localhost:18888",AGENT_API_URL="http://localhost:8100",REDIS_URL="redis://localhost:6379/0",PUBLIC_BASE_URL="http://localhost:8056",DB_HOST="localhost",DB_PORT="5432",DB_NAME="kioku",DB_USER="kioku",DB_PASSWORD="kioku",DB_SCHEMA="vexa",DB_SSL_MODE="disable",VEXA_ENV="production",LOG_LEVEL="INFO"
autostart=true
autorestart=true
stdout_logfile=/var/log/api-gateway.log
stderr_logfile=/var/log/api-gateway-err.log

[program:vexa-admin-api]
command=python3 -m uvicorn main:app --host 0.0.0.0 --port 8001
directory=/workspace/kioku/services/voice/services/admin-api
environment=DB_HOST="localhost",DB_PORT="5432",DB_NAME="kioku",DB_USER="kioku",DB_PASSWORD="kioku",DB_SCHEMA="vexa",DB_SSL_MODE="disable",ADMIN_API_TOKEN="runpod-admin-token",VEXA_ENV="production",LOG_LEVEL="INFO"
autostart=true
autorestart=true
stdout_logfile=/var/log/admin-api.log
stderr_logfile=/var/log/admin-api-err.log

[program:vexa-meeting-api]
command=python3 -m uvicorn main:app --host 0.0.0.0 --port 8080
directory=/workspace/kioku/services/voice/services/meeting-api
environment=DB_HOST="localhost",DB_PORT="5432",DB_NAME="kioku",DB_USER="kioku",DB_PASSWORD="kioku",DB_SSL_MODE="disable",REDIS_URL="redis://localhost:6379/0",TRANSCRIPTION_SERVICE_URL="http://localhost:80",TTS_SERVICE_URL="http://localhost:8002",RUNTIME_API_URL="http://localhost:8080",ADMIN_TOKEN="runpod-admin-token",VEXA_ENV="production",LOG_LEVEL="INFO",CAPTURE_MODES="audio"
autostart=true
autorestart=true
stdout_logfile=/var/log/meeting-api.log
stderr_logfile=/var/log/meeting-api-err.log

[program:vexa-mcp]
command=python3 -m uvicorn main:app --host 0.0.0.0 --port 18888
directory=/workspace/kioku/services/voice/services/mcp
environment=API_GATEWAY_URL="http://localhost:8000",VEXA_ENV="production",LOG_LEVEL="INFO"
autostart=true
autorestart=true
stdout_logfile=/var/log/mcp.log
stderr_logfile=/var/log/mcp-err.log

[program:vexa-tts-service]
command=python3 -m uvicorn main:app --host 0.0.0.0 --port 8002
directory=/workspace/kioku/services/voice/services/tts-service
environment=VEXA_ENV="production",LOG_LEVEL="INFO"
autostart=true
autorestart=true
stdout_logfile=/var/log/tts-service.log
stderr_logfile=/var/log/tts-service-err.log
