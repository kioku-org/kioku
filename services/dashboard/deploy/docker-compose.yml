name: kioku-dashboard

services:
  dashboard:
    build:
      context: ../
      dockerfile: Dockerfile
      args:
        KIOKU_API_URL: ${KIOKU_API_URL:-http://vexa-api-gateway:8000}
    container_name: kioku-dashboard
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOSTNAME=0.0.0.0
      - KIOKU_API_URL=${VEXA_API_URL:-http://vexa-api-gateway:8000}
      - VEXA_API_URL=${VEXA_API_URL:-http://vexa-api-gateway:8000}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://dashboard.kioku.chat}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://dashboard.kioku.chat}
      - VEXA_PUBLIC_API_URL=${VEXA_PUBLIC_API_URL:-https://api.kioku.chat}
      - VEXA_ALLOW_DIRECT_LOGIN=${VEXA_ALLOW_DIRECT_LOGIN:-true}
      - VEXA_ADMIN_API_KEY=${VEXA_ADMIN_API_KEY:-}
      - VEXA_ADMIN_API_URL=${VEXA_ADMIN_API_URL:-http://vexa-admin-api:8001}
      - VEXA_API_KEY=${VEXA_API_KEY:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - NEXT_PUBLIC_DOCS_URL=${NEXT_PUBLIC_DOCS_URL:-https://docs.kioku.chat}
      - NEXT_PUBLIC_HOSTED_MODE=${NEXT_PUBLIC_HOSTED_MODE:-false}
      - NEXT_PUBLIC_WEBAPP_URL=${NEXT_PUBLIC_WEBAPP_URL:-https://kioku.chat}
      - DEFAULT_BOT_NAME=${DEFAULT_BOT_NAME:-}
    networks:
      - kioku-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  kioku-network:
    name: kioku-network
    external: true
