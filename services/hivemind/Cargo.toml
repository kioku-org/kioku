[package]
name = "kioku-hivemind"
version = "0.1.0"
edition = "2021"
license = "MIT"
# tests/ is its own crate (tests/Cargo.toml, its own deps) for the HIVEMIND_URL-based
# integration suite — without this, `cargo test`/`clippy --all-targets` from this directory
# auto-discovers those .rs files as integration tests of *this* package and fails to resolve
# their dependencies (they're declared in tests/Cargo.toml, not here).
autotests = false

[dependencies]
axum = { version = "0.7", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
jsonwebtoken = "9"
bcrypt = "0.16"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
tower-http = { version = "0.6", features = ["cors", "trace"] }
reqwest = { version = "0.12", features = ["json"] }
config = { version = "0.14", features = ["toml"] }
# langchain-rust + qdrant
langchain-rust = { package = "langchain-rust-openrouter", git = "https://github.com/coolcmyk/langchain-rust-openrouter", features = ["qdrant", "ollama"] }
qdrant-client = "=1.10.1"
ollama-rs = "0.2.0"
async-trait = "0.1"

# Document parsing
pdf-extract = "0.7"
docx-rs = "0.4"
zip = "0.6"
url = "2"
tempfile = "3"
