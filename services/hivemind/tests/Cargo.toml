[package]
name = "kioku-hivemind-integration-tests"
version = "0.1.0"
edition = "2021"

[[test]]
name = "integration_auth"
path = "integration_auth.rs"

[[test]]
name = "integration_company"
path = "integration_company.rs"

[[test]]
name = "integration_sessions"
path = "integration_sessions.rs"

[[test]]
name = "integration_meetings"
path = "integration_meetings.rs"

[[test]]
name = "integration_knowledge"
path = "integration_knowledge.rs"

[[test]]
name = "integration_vexa"
path = "integration_vexa.rs"

[[test]]
name = "quality_retrieval"
path = "quality_retrieval.rs"

[dependencies]
reqwest = { version = "0.12", features = ["json", "multipart"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
docx-rs = "0.4"