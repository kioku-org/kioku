[package]
name = "kioku-transcription"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
kiku = "0.1"
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
hound = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
local-whisper = ["kiku/local-whisper"]
